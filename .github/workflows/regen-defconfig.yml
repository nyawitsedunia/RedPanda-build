name: Regenerate Defconfig

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL repo kernel (source penuh tetap dibutuhkan untuk Kconfig)'
        required: false
        default: 'RedPanda-kernel'
      kernel_branch:
        description: 'Branch kernel'
        required: false
        default: 'main'
      config_changes:
        description: 'Baris CONFIG tambahan sebelum savedefconfig (opsional, satu per baris)'
        required: false
        default: ''
      output_name:
        description: 'Nama file hasil (mis: redpanda_defconfig)'
        required: false
        default: 'redpanda_defconfig'

jobs:
  regen:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 git curl libelf-dev build-essential flex bison \
            libssl-dev libncurses-dev zlib1g-dev bc dwarves

      - name: Clone kernel source
        run: |
          git clone --depth=1 "https://github.com/Artecxyz/${{ github.event.inputs.kernel_repo }}.git" \
            -b "${{ github.event.inputs.kernel_branch }}" kernel_workspace

      - name: Cache Neutron Clang
        id: clang-cache
        uses: actions/cache@v6
        with:
          path: toolchains/clang
          key: neutron-clang-full-v2

      - name: Download & verify Neutron Clang
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p toolchains/clang && cd toolchains/clang

          if [ -x bin/clang ] && ./bin/clang --version >/dev/null 2>&1; then
            echo "Clang dari cache valid, lewati unduhan."
          else
            echo "Cache kosong/rusak, unduh ulang Neutron Clang..."
            rm -rf ./*
            curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
            chmod +x antman
            ./antman -S latest
            ./antman --patch=glibc
          fi

          ./bin/clang --version

      - name: Download defconfig & regenerate
        env:
          DEFCONFIG_URL: "https://raw.githubusercontent.com/Artecxyz/${{ github.event.inputs.kernel_repo }}/main/arch/arm64/configs/gki_defconfig"
          CONFIG_CHANGES: ${{ github.event.inputs.config_changes }}
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          MAKE="make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1"

          cd kernel_workspace

          # Nama file diambil dari URL
          DEFCONFIG_NAME="$(basename "$DEFCONFIG_URL")"
          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"

          # Unduh defconfig langsung dari link file
          curl -fLSs "$DEFCONFIG_URL" -o "$DEFCONFIG" || {
            echo "::error::Gagal mengunduh $DEFCONFIG_URL"
            exit 1
          }

          # Muat defconfig ke .config (pakai clang yang sama agar opsi
          # yang bergantung pada kompilator konsisten dengan build asli)
          $MAKE "$DEFCONFIG_NAME"

          # Terapkan perubahan CONFIG tambahan (opsional)
          if [ -n "$CONFIG_CHANGES" ]; then
            printf '%s\n' "$CONFIG_CHANGES" >> out/.config
            $MAKE olddefconfig
          fi

          # Simpan hasil sebagai full .config (semua opsi ditulis lengkap,
          # termasuk yang nilainya sama dengan default kernel)
          OUTPUT_NAME="${{ github.event.inputs.output_name }}"

          # Buang header "Automatically generated file..." sehingga file
          # hasil langsung mulai dari section "# General setup"
          sed -n '/^# General setup/,$p' out/.config > "out/${OUTPUT_NAME}"

          echo "=== Info hasil regenerate ==="
          echo "Baris defconfig awal : $(wc -l < "$DEFCONFIG")"
          echo "Baris full .config   : $(wc -l < "out/${OUTPUT_NAME}")"

      - name: Upload hasil regenerate
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-defconfig
          path: "kernel_workspace/out/${{ github.event.inputs.output_name }}"
          if-no-files-found: error
