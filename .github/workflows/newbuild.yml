name: Build RedPanda GKI Kernel new

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "Select build variant"
        required: true
        default: "ReSukiSU"
        type: choice
        options:
          - ReSukiSU
          - KernelSU-Next
      clang_choice:
        description: "Select Clang toolchain"
        required: true
        default: "Neutron"
        type: choice
        options:
          - Neutron
      # reflex:
      #   description: "Enable Reflex CPUFreq Governor (Hybrid interactive-schedutil CPU governor)"
      #   required: true
      #   default: true
      #   type: boolean
      bore:
        description: "Enable BORE Scheduler (Burst-Oriented Response Enhancer, off by default)"
        required: true
        default: true
        type: boolean
      adios:
        description: "Enable ADIOS IO Scheduler (Improves IO read/write performance)"
        required: true
        default: true
        type: boolean
      zram:
        description: "Upgrade LZ4 to the latest upstream"
        required: true
        default: true
        type: boolean
      netfilter:
        description: "Enable network feature extensions (NETFILTER)"
        required: true
        default: true
        type: boolean
      github_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: 'Asia/Jakarta'
  KERNEL_REPO: https://github.com/nyawitsedunia/RedPanda-kernel.git
  KERNEL_DEFCONFIG: redpanda_defconfig
  KBUILD_BUILD_USER: Artecxyz
  KBUILD_BUILD_HOST: dev

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 10G
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🧠 Add swap space (for LTO link)
        run: |
          sudo fallocate -l 16G /mnt/swap_lto || sudo dd if=/dev/zero of=/mnt/swap_lto bs=1M count=16384
          sudo chmod 600 /mnt/swap_lto
          sudo mkswap /mnt/swap_lto
          sudo swapon /mnt/swap_lto
          echo "── swap after ──"; free -h
          
      - name: ⬇️ Clone kernel source
        run: |
          git clone --depth=1 "$KERNEL_REPO" kernel_workspace
          cd kernel_workspace
          KERNEL_VERSION=$(grep '^VERSION =' Makefile | sed 's/.*= //')
          KERNEL_PATCHLEVEL=$(grep '^PATCHLEVEL =' Makefile | sed 's/.*= //')
          KERNEL_SUBLEVEL=$(grep '^SUBLEVEL =' Makefile | sed 's/.*= //')
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "KERNEL_PATCHLEVEL=$KERNEL_PATCHLEVEL" >> $GITHUB_ENV
          echo "KERNEL_SUBLEVEL=$KERNEL_SUBLEVEL" >> $GITHUB_ENV
          echo "KERNEL_VER=$KERNEL_VERSION.$KERNEL_PATCHLEVEL" >> $GITHUB_ENV
          echo "KERNEL_FULL_VERSION=$KERNEL_VERSION.$KERNEL_PATCHLEVEL.$KERNEL_SUBLEVEL" >> $GITHUB_ENV

      - name: ⚙️ Configure CCache Directory
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          echo "LDCACHE_DIR=$GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          mkdir -p $GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}

      - name: 💾 Restore APT Cache
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ~/.apt-pkg-cache
          key: apt-cache-${{ runner.os }}-${{ env.KERNEL_VER }}

      - name: 📦 Install Dependencies
        run: |
          export APT_PACKAGES="python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves"
          bash "$GITHUB_WORKSPACE/scripts/cache_apt_pkgs.sh" ~/.apt-pkg-cache
          
      - name: 💾 Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v6
        with:
          path: toolchains/clang
          key: clang-${{ github.event.inputs.clang_choice }}

      - name: ⬇️ Download & Setup Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/clang && cd toolchains/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: 💾 Restore Cache
        id: restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.clang_choice }}-${{ env.KERNEL_FULL_VERSION }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.clang_choice }}-

      - name: 💾 Restore ThinLTO Cache
        id: restore-thinlto
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: thinlto-cache-${{ runner.os }}-${{ env.KERNEL_FULL_VERSION }}
          restore-keys: |
            thinlto-cache-${{ runner.os }}-
            
      - name: ⚙️ Initialize Ccache
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "Initializing ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              ccache -o compression=true
              ccache -o compiler_check=none
              ccache -o hash_dir=false
              ccache -o direct_mode=true
              ccache -o depend_mode=false
              ccache -o base_dir="${{ github.workspace }}"
              ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros,locale
              touch "$INIT_FLAG"
              echo "✅ ccache initialization complete"
            else
              echo "✅ ccache already initialized, skipping."
            fi
          else
            echo "❌ ccache not installed, skipping."
          fi

          echo "Initial CCache status:"
          ccache -s

          echo "Updating atime to achieve cache eviction..."
          find "${{ env.CCACHE_DIR }}" -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} + || true

      - name: ⚡ Setup KernelSU
        working-directory: kernel_workspace
        run: |
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "ReSukiSU" ]; then
            echo "🛠️ Setting up ReSukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
            cd KernelSU
            KSU_VERSION_COUNT=$(git rev-list --count HEAD)
            export KSUVER=$(expr $KSU_VERSION_COUNT + 30700)
            echo "KSUVER=$KSUVER" >> $GITHUB_ENV
            echo "✅ ReSukiSU $(git rev-parse --short HEAD) (ver $KSUVER)"

          elif [ "${{ github.event.inputs.kernelsu_variant }}" = "KernelSU-Next" ]; then
            echo "🛠️ Setting up KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh" | bash -s stable
            cd KernelSU-Next
            KSU_VERSION_COUNT=$(git rev-list --count HEAD)
            export KSUVER=$(expr $KSU_VERSION_COUNT + 10200)
            echo "KSUVER=$KSUVER" >> $GITHUB_ENV
            echo "✅ KernelSU-Next $(git rev-parse --short HEAD) (ver $KSUVER)"

          else
            echo "❌ Unrecognized variant: ${{ github.event.inputs.kernelsu_variant }}"
            exit 1
          fi

      - name: 🔧 Setup Patches (SUSFS)
        working-directory: kernel_workspace
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6
          
          cp susfs4ksu/kernel_patches/fs/* ./fs/
          cp susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./
          
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch || true
          if grep -q "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" fs/proc/task_mmu.c 2>/dev/null; then
            echo "✅ SUSFS setup complete"
          else
            echo "⚠️  SUS_MAP guard not found — patch may need adjustment"
          fi

      # - name: Apply Reflex CPUFreq Governor
      #   if: ${{ github.event.inputs.reflex == 'true' }}
      #   working-directory: kernel_workspace
      #   run: |
      #     REFLEX_PATCH="$GITHUB_WORKSPACE/patches/reflex.patch"
      #     if [ -f "$REFLEX_PATCH" ]; then
      #       patch -p1 -F 3 < "$REFLEX_PATCH"
      #       echo "✅ Reflex CPUFreq Governor applied"
      #     else
      #       echo "::warning::Reflex CPUFreq Governor patch not found at $REFLEX_PATCH — skipping"
      #     fi
          
      - name: Apply BORE Scheduler
        if: ${{ github.event.inputs.bore == 'true' }}
        working-directory: kernel_workspace
        run: |
          BORE_PATCH="$GITHUB_WORKSPACE/patches/bore.patch"
          if [ -f "$BORE_PATCH" ]; then
            patch -p1 -F 3 < "$BORE_PATCH"
            echo "✅ BORE scheduler applied"
          else
            echo "::warning::BORE scheduler patch not found at $BORE_PATCH — skipping"
          fi

      - name: Configure ZRAM LZ4 + LZ4K/LZ4KD
        if: ${{ github.event.inputs.zram == 'true' }}
        working-directory: kernel_workspace
        run: |
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $GITHUB_WORKSPACE/zram/lz4/lib/* ./lib/
          cp -r $GITHUB_WORKSPACE/zram/lz4/include/linux/* ./include/linux/
          bash $GITHUB_WORKSPACE/zram/apply_lz4_neon.sh

          cp -r $GITHUB_WORKSPACE/zram/lz4k/lib/* ./lib/
          cp -r $GITHUB_WORKSPACE/zram/lz4k/crypto/* ./crypto/
          cp -r $GITHUB_WORKSPACE/zram/lz4k/include/linux/* ./include/linux/

          LZ4KD_PATCH="$GITHUB_WORKSPACE/zram/lz4k/lz4kd.patch"
          if [ -f "$LZ4KD_PATCH" ]; then
            patch -p1 -F 3 < "$LZ4KD_PATCH" || true
            echo "✅ LZ4KD patch applied"
          else
            echo "::warning::LZ4KD patch not found at $LZ4KD_PATCH — skipping"
          fi
          
      - name: ⚙️ Configure Kernel Options
        working-directory: kernel_workspace
        run: |
          DEFCONFIG="./arch/arm64/configs/$KERNEL_DEFCONFIG"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found"
            exit 1
          fi

          set_config() {
            local key="$1"
            local value="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "${key}=${value}" >> "$DEFCONFIG"
          
            if grep -Fxq "${key}=${value}" "$DEFCONFIG"; then
              echo "${key}=${value} (✅ SUCCESS)"
            else
              echo "${key}=${value} (❌ FAILED)" >&2
              return 1
            fi
          }
          
          set_config CONFIG_KSU y
          set_config CONFIG_KALLSYMS y
          set_config CONFIG_KALLSYMS_ALL y
          
          set_config CONFIG_HEADERS_INSTALL n
          set_config CONFIG_LD_DEAD_CODE_DATA_ELIMINATION y
          
          sed -i '/^CONFIG_LTO_NONE=y/{ s/^/# /; s/=y$/ is not set/; }' "$DEFCONFIG"
          set_config CONFIG_LTO_CLANG_THIN y
          
          set_config CONFIG_KSU_SUSFS y
          set_config CONFIG_KSU_SUSFS_SUS_PATH y
          set_config CONFIG_KSU_SUSFS_SUS_MOUNT y
          set_config CONFIG_KSU_SUSFS_SUS_KSTAT y
          set_config CONFIG_KSU_SUSFS_SPOOF_UNAME y
          set_config CONFIG_KSU_SUSFS_ENABLE_LOG y
          set_config CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          set_config CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
          set_config CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          set_config CONFIG_KSU_SUSFS_SUS_MAP y

          if [ "${{ github.event.inputs.adios }}" = "true" ]; then
            set_config CONFIG_MQ_IOSCHED_DEFAULT_ADIOS y
          fi

          if [ "${{ github.event.inputs.bore }}" = "true" ]; then
            set_config CONFIG_SCHED_BORE y
          fi
          
          if [ "${{ github.event.inputs.zram }}" = "true" ]; then
            set_config CONFIG_ZSMALLOC y
            set_config CONFIG_ZRAM y
            set_config CONFIG_CRYPTO_LZ4HC y
            set_config CONFIG_CRYPTO_LZ4K y
            set_config CONFIG_CRYPTO_LZ4KD y
            set_config CONFIG_ZRAM_WRITEBACK y
            set_config CONFIG_ZRAM_MEMORY_TRACKING y
          fi

          if [ "${{ github.event.inputs.netfilter }}" = "true" ]; then
            set_config CONFIG_BPF_STREAM_PARSER y
            set_config CONFIG_IP_SET y
            set_config CONFIG_IP_SET_MAX 65534
            set_config CONFIG_IP_SET_BITMAP_IP y
            set_config CONFIG_IP_SET_BITMAP_IPMAC y
            set_config CONFIG_IP_SET_BITMAP_PORT y
            set_config CONFIG_IP_SET_HASH_IP y
            set_config CONFIG_IP_SET_HASH_IPMARK y
            set_config CONFIG_IP_SET_HASH_IPPORT y
            set_config CONFIG_IP_SET_HASH_IPPORTIP y
            set_config CONFIG_IP_SET_HASH_IPPORTNET y
            set_config CONFIG_IP_SET_HASH_IPMAC y
            set_config CONFIG_IP_SET_HASH_MAC y
            set_config CONFIG_IP_SET_HASH_NETPORTNET y
            set_config CONFIG_IP_SET_HASH_NET y
            set_config CONFIG_IP_SET_HASH_NETNET y
            set_config CONFIG_IP_SET_HASH_NETPORT y
            set_config CONFIG_IP_SET_HASH_NETIFACE y
            set_config CONFIG_IP_SET_LIST_SET y
            set_config CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
            set_config CONFIG_NETFILTER_XT_SET y
            set_config CONFIG_IP6_NF_NAT y
            set_config CONFIG_IP6_NF_TARGET_MASQUERADE y

            set_config CONFIG_NETFILTER_XT_TARGET_HL y
            set_config CONFIG_IP_NF_TARGET_TTL y
            set_config CONFIG_IP6_NF_TARGET_HL y
            set_config CONFIG_NETFILTER_XT_MATCH_HL y
            set_config CONFIG_IP_NF_MATCH_TTL y
            set_config CONFIG_IP6_NF_MATCH_HL y
            set_config CONFIG_IP_NF_MANGLE y
            set_config CONFIG_IP6_NF_MANGLE y
          fi
          
          sed -i 's/check_defconfig//' "$KERNEL_ROOT/build.config.gki" 2>/dev/null || true
          echo "Kernel configs enabled in $KERNEL_DEFCONFIG"
          
      - name: 🔨 Build Kernel
        working-directory: kernel_workspace
        run: |
          export MAP="-fdebug-prefix-map=${GITHUB_WORKSPACE}=. -fmacro-prefix-map=${GITHUB_WORKSPACE}=. -ffile-prefix-map=${GITHUB_WORKSPACE}=."
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export KBUILD_COMPILER_STRING="$($GITHUB_WORKSPACE/toolchains/clang/bin/clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
          export KBUILD_BUILD_USER=$KBUILD_BUILD_USER
          export KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST

          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_IS_KERNEL_COMPILING=true
          
          CLANG_DIR="$GITHUB_WORKSPACE/toolchains/clang/bin"
          echo "Clang:  $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD:    $($CLANG_DIR/ld.lld --version | head -n 1)"
          echo "PAHOLE: $(pahole --version 2>/dev/null)" || echo "PAHOLE: Not Installed"
          
          # RAM disk for build output (15GB RAM available, safe to use)
          mkdir -p $GITHUB_WORKSPACE/kout
          mkdir -p "$GITHUB_WORKSPACE/ldcache_$KERNEL_FULL_VERSION"

          # LTO thin cache wrapper pointing to RAM disk
          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }} --thinlto-jobs=$(($(nproc --all) / 2))' >> ld-wrapper
          chmod +x ld-wrapper

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so || true
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so || true
          chmod 777 ./*.so || true
          export FAKESTAT="1999-09-09 12:00:00"
          export FAKETIME="@1999-09-09 13:00:00"
          export PRELOAD_LIBS="$(pwd)/libfakestat.so $(pwd)/libfaketimeMT.so"
          
          KCFLAGS="-pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option"
          
          # Defconfig pass — output to RAM disk
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" HOSTCC="ccache gcc" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="$KCFLAGS" \
            $KERNEL_DEFCONFIG || { echo "make defconfig failed"; exit 1; }

          # Image build — output to RAM disk
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" HOSTCC="ccache gcc" LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" \
            O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="$KCFLAGS" \
            Image || { echo "make failed"; exit 1; }

          echo "Kernel Compilation Complete!"
          ccache -c
          ccache --evict-older-than 10800s
          echo "CCache Status:"
          ccache -s
          df -h

      - name: 📦 Make AnyKernel3
        working-directory: kernel_workspace
        run: |
          git clone --depth=1 https://github.com/Artecxyz/AnyKernel3.git
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp $GITHUB_WORKSPACE/kout/arch/arm64/boot/Image ./Image
          if [ ! -f ./Image ]; then
            echo "Kernel Image not found, build may have failed."
            exit 1
          fi
          gzip -n -f -9 ./Image
          ZIP_NAME=RedPanda-GKI-${{ github.event.inputs.kernelsu_variant }}-$(date +%Y%m%d-%H%M).zip
          zip -r9 "../$ZIP_NAME" ./*

      - name: 📤 Upload zip artifact
        if: github.event.inputs.kernelsu_variant != 'none' && github.event.inputs.github_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: RedPanda-GKI-${{ github.event.inputs.kernelsu_variant }}
          path: kernel_workspace/RedPanda-GKI-${{ github.event.inputs.kernelsu_variant }}-*.zip
          retention-days: 7

      - name: 📤 Upload to GitHub Release
        if: github.event.inputs.github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.kernelsu_variant }}-${{ env.KSUVER }}
          name: RedPanda GKI ${{ github.event.inputs.kernelsu_variant }} v${{ env.KSUVER }} - ${{ env.KERNEL_FULL_VERSION }}
          files: kernel_workspace/*.zip

      - name: 📦 Save Cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.clang_choice }}-${{ env.KERNEL_FULL_VERSION }}

      - name: 📦 Save ThinLTO Cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: thinlto-cache-${{ runner.os }}-${{ env.KERNEL_FULL_VERSION }}
